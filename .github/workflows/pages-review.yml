name: Publish permitted Sami review portal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sami-review-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit publication permission and approved branch
        env:
          AUTHORIZED: ${{ vars.SPICT_REVIEW_PORTAL_PUBLICATION_AUTHORIZED }}
          BRANCH: ${{ github.ref }}
        run: |
          test "$AUTHORIZED" = "true" || { echo "Publication permission missing"; exit 1; }
          test "$BRANCH" = "refs/heads/g5-human-adjudication" || { echo "Branch not allowed"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate frozen data
        run: python scripts/validate_sami_review_portal.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: review-portal/site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck authorization
        env:
          AUTHORIZED: ${{ vars.SPICT_REVIEW_PORTAL_PUBLICATION_AUTHORIZED }}
        run: test "$AUTHORIZED" = "true"
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
