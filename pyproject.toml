[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spict4all-fi"
version = "0.1.0"
description = "Reproducible evidence tooling for the SPICT-4ALL Finnish translation workflow"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
spict4all = "spict4all.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
